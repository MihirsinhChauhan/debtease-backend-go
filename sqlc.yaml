version: "2"
sql:
  - schema: "database/schema"
    queries: "database/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        overrides:
          # Map Postgres numeric/decimal to shopspring/decimal
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.decimal"
            go_type: "github.com/shopspring/decimal.Decimal"
          # Explicitly ensure users.monthly_income is decimal
          - column: "users.monthly_income"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: debts.accrued_interest
            go_type: github.com/shopspring/decimal.Decimal
          - column: debts.last_accrual_date
            go_type: time.Time
          - column: debts.monthly_obligation
            go_type: github.com/shopspring/decimal.Decimal
          - column: debts.minimum_obligation
            go_type: github.com/shopspring/decimal.Decimal
          - column: debts.fragmentation_weight
            go_type: github.com/shopspring/decimal.Decimal
          - column: financial_snapshots.unsecured_monthly_obligation
            go_type: github.com/shopspring/decimal.Decimal
          - column: financial_snapshots.revolving_monthly_obligation
            go_type: github.com/shopspring/decimal.Decimal
          - column: financial_snapshots.short_term_obligations
            go_type: github.com/shopspring/decimal.Decimal
          - column: credit_cards.minimum_due
            go_type: github.com/shopspring/decimal.Decimal
          - column: credit_cards.credit_limit
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: credit_card_statements.statement_amount
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: credit_card_statements.minimum_due
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: credit_card_statements.previous_balance
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: credit_card_statements.payments_received
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: credit_card_statements.new_balance
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: credit_card_statements.credit_limit
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: credit_card_statements.available_credit
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          # financial_snapshots: nullable aggregates as decimal (avoid sql.NullString)
          - column: "financial_snapshots.monthly_income"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "financial_snapshots.other_income"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "financial_snapshots.fixed_expenses"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "financial_snapshots.variable_expenses"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "financial_snapshots.savings_cash"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "financial_snapshots.investments_value"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "financial_snapshots.total_monthly_emi"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "financial_snapshots.total_debt_balance"
            go_type: "github.com/shopspring/decimal.Decimal"
          - column: "finance_steps.monthly_income"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: "finance_steps.fixed_obligations"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"